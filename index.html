<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirBlink - Dynamic Preview Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #000;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --accent-color: #3b82f6;
      --success-color: #10b981;
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* แถบเมนูด้านบน */
    .header-nav {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; background: rgba(30, 41, 59, 0.85);
      padding: 4px; border-radius: 30px; backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .nav-btn {
      padding: 8px 18px; border: none; background: transparent;
      color: #94a3b8; font-weight: bold; font-size: 13px; border-radius: 20px; cursor: pointer;
      white-space: nowrap; transition: 0.2s;
    }
    .nav-btn.active { background: var(--accent-color); color: #fff; }

    .tab-content { display: none; width: 100vw; height: 100vh; position: relative; }
    .tab-content.active { display: flex; align-items: center; justify-content: center; }

    /* ==================== 📤 SENDER ==================== */
    #qrcode {
      background: #fff; padding: 16px; border-radius: 16px;
      display: flex; justify-content: center; align-items: center;
      z-index: 1; box-shadow: 0 0 30px rgba(255,255,255,0.1);
    }
    #qrcode img {
      width: min(70vw, 70vh) !important;
      height: min(70vw, 70vh) !important;
      object-fit: contain;
    }

    /* ==================== 📥 RECEIVER ==================== */
    #reader {
      position: absolute; top: 0; left: 0;
      width: 100vw !important; height: 100vh !important;
      border: none !important; z-index: 1;
    }
    #reader video {
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
    }

    /* ปุ่มเปิด/ปิด แผงข้างๆ */
    .toggle-side-btn {
      position: absolute; right: 12px; top: 12px; z-index: 1001;
      background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 12px;
      cursor: pointer; font-weight: bold; backdrop-filter: blur(8px);
    }

    /* แผงควบคุมข้างๆ (ใช้ร่วมกันทั้งฝั่งส่งและรับ) */
    .side-panel {
      position: absolute; right: 12px; top: 60px; bottom: 20px;
      width: 290px; max-width: calc(100vw - 24px);
      background: var(--panel-bg); padding: 16px; border-radius: 16px; z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; gap: 10px;
      backdrop-filter: blur(12px); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
    }
    .side-panel.collapsed { transform: translateX(calc(100% + 20px)); }

    textarea {
      width: 100%; flex: 1; min-height: 80px; background: #0f172a;
      border: 1px solid #334155; color: #fff; padding: 10px;
      border-radius: 8px; font-size: 12px; resize: none; font-family: inherit;
    }
    .btn {
      width: 100%; padding: 12px; background: var(--accent-color); color: white;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn-success { background: var(--success-color); }
    .btn:active { opacity: 0.8; }
    
    .progress-bar-container { width: 100%; background: rgba(255,255,255,0.2); height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0; }
    .progress-bar { width: 0%; height: 100%; background: var(--success-color); transition: width 0.05s; }
    .status-text { font-size: 12px; color: #38bdf8; font-weight: bold; text-align: center; }

    /* ==================== 🎁 PREVIEW MODAL (หน้าต่างผลลัพธ์) ==================== */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 2000;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 450px;
      border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; gap: 14px; text-align: center;
    }
    .modal-card h2 { margin: 0; color: var(--success-color); font-size: 20px; }

    #reader__dashboard { display: none !important; }

    @media (max-width: 480px) {
      .side-panel { top: 60px; bottom: 12px; width: 260px; }
      #qrcode img { width: min(82vw, 82vh) !important; height: min(82vw, 82vh) !important; }
    }
  </style>
</head>
<body>

  <!-- แถบเมนูด้านบน -->
  <div class="header-nav">
    <button class="nav-btn active" onclick="switchTab('sender')">📤 ฝั่งส่ง (Sender)</button>
    <button class="nav-btn" onclick="switchTab('receiver')">📥 ฝั่งรับ (Receiver)</button>
  </div>

  <button class="toggle-side-btn" id="toggleBtn" onclick="toggleSidePanel()">⚙️ เมนูตั้งค่า</button>

  <!-- ==================== SENDER TAB ==================== -->
  <div id="sender-tab" class="tab-content active">
    <div id="qrcode"></div>

    <div class="side-panel" id="senderSidePanel">
      <span style="font-size: 13px; font-weight: bold; color: #94a3b8;">📥 ข้อมูล หรือ เลือกไฟล์:</span>
      <textarea id="sendPayload" placeholder="พิมพ์ข้อความ หรือเลือกไฟล์..."></textarea>
      <input type="file" id="fileInput" style="width: 100%; color: #fff; font-size: 12px;">
      <button class="btn" onclick="startTransmission()">🚀 เริ่มส่งข้อมูล</button>
      <div class="status-text" id="sendStatus" style="margin-top: 4px;">พร้อมส่ง</div>
    </div>
  </div>

  <!-- ==================== RECEIVER TAB ==================== -->
  <div id="receiver-tab" class="tab-content">
    <div id="reader"></div>

    <!-- แผงข้างๆ ฝั่งรับ -->
    <div class="side-panel" id="receiverSidePanel">
      <span style="font-size: 13px; font-weight: bold; color: #94a3b8;">📷 สถานะการสแกน:</span>
      <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
      <div class="status-text" id="recvStatus">รอกดเปิดกล้อง</div>
      <button class="btn" id="startCamBtn" onclick="startCamera()" style="margin-top: 8px;">📷 เปิดกล้องสแกน</button>
    </div>
  </div>

  <!-- ==================== 🎁 POPUP PREVIEW MODAL ==================== -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-card">
      <h2>🎉 ได้รับข้อมูลครบ 100%!</h2>
      <span style="font-size: 12px; color: #94a3b8;">พรีวิวข้อมูลที่สแกนสำเร็จ:</span>
      
      <textarea id="modalOutput" readonly style="height: 150px; color: #34d399;"></textarea>

      <a id="modalDownloadBtn" style="display:none; text-decoration:none;" download="airblink_received_file">
        <button class="btn btn-success">💾 ดาวน์โหลดไฟล์ที่ได้รับ</button>
      </a>

      <button class="btn" onclick="closeModal()" style="background: #475569;">❌ ปิดหน้าต่าง</button>
    </div>
  </div>

  <script>
    function calcQRSize() { return Math.min(window.innerWidth, window.innerHeight) * 0.7; }

    let qrSize = calcQRSize();
    const qrElement = document.getElementById("qrcode");
    let qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.L });

    window.addEventListener('resize', () => {
      qrSize = calcQRSize();
      qrElement.innerHTML = "";
      qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.L });
    });

    function switchTab(mode) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (mode === 'sender') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('sender-tab').classList.add('active');
        stopCamera();
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('receiver-tab').classList.add('active');
        stopTransmission();
      }
    }

    function toggleSidePanel() {
      const activeTab = document.querySelector('.tab-content.active').id;
      if (activeTab === 'sender-tab') {
        document.getElementById('senderSidePanel').classList.toggle('collapsed');
      } else {
        document.getElementById('receiverSidePanel').classList.toggle('collapsed');
      }
    }

    // SENDER LOGIC
    let sendTimer = null;
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => document.getElementById('sendPayload').value = e.target.result;
      reader.readAsDataURL(file);
    });

    function startTransmission() {
      const data = document.getElementById('sendPayload').value;
      if (!data) return alert("กรุณากรอกข้อมูลหรือเลือกไฟล์!");

      const chunkSize = 800; 
      const speed = 35;     

      const chunks = [];
      const total = Math.ceil(data.length / chunkSize);
      for (let i = 0; i < total; i++) {
        chunks.push(`${i + 1}/${total}|${data.substr(i * chunkSize, chunkSize)}`);
      }

      stopTransmission();
      let idx = 0;
      document.getElementById('senderSidePanel').classList.add('collapsed');

      sendTimer = setInterval(() => {
        qrCode.clear();
        qrCode.makeCode(chunks[idx]);
        document.getElementById('sendStatus').innerText = `ส่งชิ้นที่ ${idx + 1} / ${total}`;
        idx = (idx + 1) % total;
      }, speed);
    }

    function stopTransmission() {
      if (sendTimer) clearInterval(sendTimer);
    }

    // RECEIVER LOGIC
    let html5Qr = null;
    let chunks = {};
    let totalChunks = 0;
    let isDone = false;

    function startCamera() {
      chunks = {}; totalChunks = 0; isDone = false;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('receiverSidePanel').classList.add('collapsed'); // พับแผงข้างๆ เพื่อเปิดจอใส

      if (!html5Qr) html5Qr = new Html5Qrcode("reader");

      html5Qr.start(
        { facingMode: "environment" },
        { fps: 60, qrbox: { width: Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.8), height: Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.8) } },
        onScanSuccess
      ).then(() => {
        document.getElementById('startCamBtn').style.display = 'none';
        document.getElementById('recvStatus').innerText = "📷 สแกนเต็มจอ...";
      }).catch(err => alert("เปิดกล้องไม่ได้: " + err));
    }

    function stopCamera() {
      if (html5Qr && html5Qr.isScanning) {
        html5Qr.stop().then(() => {
          document.getElementById('startCamBtn').style.display = 'block';
          document.getElementById('recvStatus').innerText = "รอกดเปิดกล้อง";
        });
      }
    }

    function onScanSuccess(text) {
      if (isDone) return;
      const match = text.match(/^(\d+)\/(\d+)\|(.*)$/s);
      if (match) {
        const curr = parseInt(match[1]);
        totalChunks = parseInt(match[2]);
        
        if (!chunks[curr]) {
          chunks[curr] = match[3];
          const count = Object.keys(chunks).length;
          const pct = Math.round((count / totalChunks) * 100);
          
          document.getElementById('progressBar').style.width = pct + '%';
          document.getElementById('recvStatus').innerText = `สแกนได้ ${count}/${totalChunks} (${pct}%)`;
          
          // 🚀 เมื่อรับข้อมูลครบ 100%
          if (count === totalChunks) {
            isDone = true;
            
            // 1. ปิดกล้องทันที
            stopCamera();

            // 2. นำข้อมูลมารวมกัน
            let fullData = "";
            for (let i = 1; i <= totalChunks; i++) fullData += chunks[i];

            // 3. แสดงหน้าต่าง Preview Modal
            document.getElementById('modalOutput').value = fullData;

            const dlBtn = document.getElementById('modalDownloadBtn');
            if (fullData.startsWith("data:")) {
              dlBtn.href = fullData;
              dlBtn.style.display = 'block';
            } else {
              dlBtn.style.display = 'none';
            }

            document.getElementById('previewModal').classList.add('active');
          }
        }
      }
    }

    function closeModal() {
      document.getElementById('previewModal').classList.remove('active');
      document.getElementById('receiverSidePanel').classList.remove('collapsed');
    }
  </script>
</body>
</html>
