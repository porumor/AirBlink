<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirBlink - Clean UI Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #000;
      --accent-color: #3b82f6;
      --success-color: #10b981;
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* แถบสลับโหมดลอยเล็กๆ บนสุด */
    .header-nav {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; background: rgba(15, 23, 42, 0.7);
      padding: 3px; border-radius: 30px; backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .nav-btn {
      padding: 6px 14px; border: none; background: transparent;
      color: #94a3b8; font-weight: bold; font-size: 12px; border-radius: 20px; cursor: pointer;
    }
    .nav-btn.active { background: var(--accent-color); color: #fff; }

    .tab-content { display: none; width: 100vw; height: 100vh; position: relative; }
    .tab-content.active { display: flex; align-items: center; justify-content: center; }

    /* ==================== 📤 ฝั่งส่ง: QR คลีนๆ เต็มตา ==================== */
    #qrcode {
      background: #fff; padding: 10px; border-radius: 12px;
      display: flex; justify-content: center; align-items: center;
      z-index: 1;
    }
    #qrcode img {
      width: 85vw !important; height: 85vw !important;
      max-width: 85vh !important; max-height: 85vh !important;
      object-fit: contain;
    }

    /* แผงตั้งค่าฝั่งส่ง (ซ่อนตัวเองเมื่อกดเริ่มส่ง) */
    .sender-panel {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 380px; background: rgba(15, 23, 42, 0.95);
      padding: 12px; border-radius: 14px; z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease;
    }
    .sender-panel.hidden { opacity: 0; pointer-events: none; } /* ซ่อนมิดชิด */

    /* ==================== 📥 ฝั่งรับ: กล้องเต็มจอ 100% ==================== */
    #reader {
      position: absolute; top: 0; left: 0;
      width: 100vw !important; height: 100vh !important;
      border: none !important; z-index: 1;
    }
    #reader video {
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
    }

    /* แถบแจ้งสถานะจิ๋ว ลอยล่างสุดไม่บังภาพ */
    .bottom-bar {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      width: 85%; max-width: 360px; z-index: 10;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
      padding: 8px 12px; border-radius: 20px; text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    textarea {
      width: 100%; height: 50px; background: #0f172a; border: 1px solid #334155;
      color: #fff; padding: 6px; border-radius: 6px; margin-bottom: 6px; font-size: 11px;
    }
    .btn {
      width: 100%; padding: 8px; background: var(--accent-color); color: white;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .progress-bar-container { width: 100%; background: rgba(255,255,255,0.2); height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
    .progress-bar { width: 0%; height: 100%; background: var(--success-color); transition: width 0.05s; }
    .status-text { font-size: 11px; color: #38bdf8; font-weight: bold; }

    #reader__dashboard { display: none !important; }
  </style>
</head>
<body>

  <!-- แถบสลับโหมดลอยด้านบน -->
  <div class="header-nav">
    <button class="nav-btn active" onclick="switchTab('sender')">📤 ฝั่งส่ง</button>
    <button class="nav-btn" onclick="switchTab('receiver')">📥 ฝั่งรับ</button>
  </div>

  <!-- ==================== SENDER TAB ==================== -->
  <div id="sender-tab" class="tab-content active">
    <!-- QR Code เพียวๆ กลางจอ -->
    <div id="qrcode" onclick="toggleSenderPanel()"></div>

    <!-- แผงใส่ข้อมูล (กดที่ QR เพื่อซ่อน/เรียกคืนได้) -->
    <div class="sender-panel" id="senderPanel">
      <textarea id="sendPayload" placeholder="พิมพ์ข้อความ หรือเลือกไฟล์..."></textarea>
      <input type="file" id="fileInput" style="margin-bottom: 6px; width: 100%; color: #fff; font-size: 11px;">
      <button class="btn" onclick="startTransmission()">🚀 เริ่มส่ง (จะซ่อนเมนูอัตโนมัติ)</button>
    </div>
  </div>

  <!-- ==================== RECEIVER TAB ==================== -->
  <div id="receiver-tab" class="tab-content">
    <!-- จอภาพกล้อง 100% ไม่มีไรบัง -->
    <div id="reader"></div>

    <!-- แถบสถานะมินิมอลด้านล่างสุด -->
    <div class="bottom-bar">
      <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
      <div class="status-text" id="recvStatus">กดปุ่มเพื่อเปิดกล้อง</div>
      
      <button class="btn" id="startCamBtn" onclick="startCamera()" style="margin-top: 4px;">📷 เปิดกล้องสแกน</button>
      
      <textarea id="recvOutput" readonly placeholder="ผลลัพธ์..." style="display:none; color:#34d399; margin-top: 6px;"></textarea>
      <a id="downloadBtn" style="display:none; text-decoration:none; margin-top: 4px;" download="airblink_file">
        <button class="btn" style="background: var(--success-color);">💾 ดาวน์โหลดไฟล์</button>
      </a>
    </div>
  </div>

  <script>
    let qrSize = Math.min(window.innerWidth, window.innerHeight) * 0.85;
    const qrElement = document.getElementById("qrcode");
    let qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.L });

    function switchTab(mode) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (mode === 'sender') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('sender-tab').classList.add('active');
        stopCamera();
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('receiver-tab').classList.add('active');
        stopTransmission();
      }
    }

    function toggleSenderPanel() {
      document.getElementById('senderPanel').classList.toggle('hidden');
    }

    // SENDER LOGIC
    let sendTimer = null;
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => document.getElementById('sendPayload').value = e.target.result;
      reader.readAsDataURL(file);
    });

    function startTransmission() {
      const data = document.getElementById('sendPayload').value;
      if (!data) return alert("กรุณากรอกข้อมูลหรือเลือกไฟล์!");

      const chunkSize = 800; 
      const speed = 35;     

      const chunks = [];
      const total = Math.ceil(data.length / chunkSize);
      for (let i = 0; i < total; i++) {
        chunks.push(`${i + 1}/${total}|${data.substr(i * chunkSize, chunkSize)}`);
      }

      stopTransmission();
      let idx = 0;
      
      // ซ่อนแผงควบคุมฝั่งส่งเพื่อเคลียร์จอให้ QR ใหญ่เพียวๆ
      document.getElementById('senderPanel').classList.add('hidden');

      sendTimer = setInterval(() => {
        qrCode.clear();
        qrCode.makeCode(chunks[idx]);
        idx = (idx + 1) % total;
      }, speed);
    }

    function stopTransmission() {
      if (sendTimer) clearInterval(sendTimer);
      document.getElementById('senderPanel').classList.remove('hidden');
    }

    // RECEIVER LOGIC
    let html5Qr = null;
    let chunks = {};
    let totalChunks = 0;
    let isDone = false;

    function startCamera() {
      chunks = {}; totalChunks = 0; isDone = false;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('recvOutput').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';

      if (!html5Qr) html5Qr = new Html5Qrcode("reader");

      html5Qr.start(
        { facingMode: "environment" },
        { fps: 60, qrbox: { width: Math.floor(window.innerWidth * 0.9), height: Math.floor(window.innerWidth * 0.9) } },
        onScanSuccess
      ).then(() => {
        document.getElementById('startCamBtn').style.display = 'none';
        document.getElementById('recvStatus').innerText = "📷 สแกนเต็มจอ...";
      }).catch(err => alert("เปิดกล้องไม่ได้: " + err));
    }

    function stopCamera() {
      if (html5Qr && html5Qr.isScanning) {
        html5Qr.stop().then(() => {
          document.getElementById('startCamBtn').style.display = 'block';
          document.getElementById('recvStatus').innerText = "กดเพื่อเปิดกล้อง";
        });
      }
    }

    function onScanSuccess(text) {
      if (isDone) return;
      const match = text.match(/^(\d+)\/(\d+)\|(.*)$/s);
      if (match) {
        const curr = parseInt(match[1]);
        totalChunks = parseInt(match[2]);
        
        if (!chunks[curr]) {
          chunks[curr] = match[3];
          const count = Object.keys(chunks).length;
          const pct = Math.round((count / totalChunks) * 100);
          
          document.getElementById('progressBar').style.width = pct + '%';
          document.getElementById('recvStatus').innerText = `สแกนได้ ${count} / ${totalChunks} (${pct}%)`;
          
          if (count === totalChunks) {
            isDone = true;
            document.getElementById('recvStatus').innerText = "✅ สำเร็จ!";
            let fullData = "";
            for (let i = 1; i <= totalChunks; i++) fullData += chunks[i];
            
            const output = document.getElementById('recvOutput');
            output.value = fullData;
            output.style.display = 'block';

            if (fullData.startsWith("data:")) {
              const dl = document.getElementById('downloadBtn');
              dl.href = fullData;
              dl.style.display = 'block';
            }
            stopCamera();
          }
        }
      }
    }
  </script>
</body>
</html>
