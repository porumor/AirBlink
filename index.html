<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirBlink - Side Panel Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #000;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --accent-color: #3b82f6;
      --success-color: #10b981;
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* แถบเลือกโหมดลอยด้านบน */
    .header-nav {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; background: rgba(30, 41, 59, 0.8);
      padding: 3px; border-radius: 30px; backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .nav-btn {
      padding: 6px 14px; border: none; background: transparent;
      color: #94a3b8; font-weight: bold; font-size: 12px; border-radius: 20px; cursor: pointer;
    }
    .nav-btn.active { background: var(--accent-color); color: #fff; }

    .tab-content { display: none; width: 100vw; height: 100vh; position: relative; }
    .tab-content.active { display: flex; align-items: center; justify-content: center; }

    /* ==================== 📤 ฝั่งส่ง: QR เพียวๆ ตรงกลาง ==================== */
    #qrcode {
      background: #fff; padding: 12px; border-radius: 12px;
      display: flex; justify-content: center; align-items: center;
      z-index: 1;
    }
    #qrcode img {
      width: 75vw !important; height: 75vw !important;
      max-width: 75vh !important; max-height: 75vh !important;
      object-fit: contain;
    }

    /* แผงอัปโหลดขยับไปอยู่ "ข้างๆ" (Sidebar Right) */
    .side-panel {
      position: absolute; right: 10px; top: 60px; bottom: 20px;
      width: 280px; background: var(--panel-bg);
      padding: 14px; border-radius: 16px; z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex; flex-direction: column; gap: 8px;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }
    .side-panel.collapsed {
      transform: translateX(300px); /* พับซ่อนไปทางขวาเมื่อกดปิด */
    }

    /* ปุ่มกดพับ/กาง แผงข้างๆ */
    .toggle-side-btn {
      position: absolute; right: 10px; top: 12px; z-index: 1001;
      background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px;
      cursor: pointer; font-weight: bold;
    }

    /* ==================== 📥 ฝั่งรับ: กล้องเต็มจอ ==================== */
    #reader {
      position: absolute; top: 0; left: 0;
      width: 100vw !important; height: 100vh !important;
      border: none !important; z-index: 1;
    }
    #reader video {
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
    }

    /* UI ข้างๆ สำหรับฝั่งรับ */
    .receiver-side-panel {
      position: absolute; left: 10px; bottom: 20px;
      width: 260px; background: rgba(0, 0, 0, 0.7);
      padding: 12px; border-radius: 14px; z-index: 100;
      backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15);
    }

    textarea {
      width: 100%; flex: 1; min-height: 80px; background: #0f172a;
      border: 1px solid #334155; color: #fff; padding: 8px;
      border-radius: 8px; font-size: 11px; resize: none;
    }
    .btn {
      width: 100%; padding: 10px; background: var(--accent-color); color: white;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .progress-bar-container { width: 100%; background: rgba(255,255,255,0.2); height: 6px; border-radius: 3px; overflow: hidden; margin: 4px 0; }
    .progress-bar { width: 0%; height: 100%; background: var(--success-color); transition: width 0.05s; }
    .status-text { font-size: 11px; color: #38bdf8; font-weight: bold; text-align: center; }

    #reader__dashboard { display: none !important; }
  </style>
</head>
<body>

  <!-- ปุ่มสลับโหมด -->
  <div class="header-nav">
    <button class="nav-btn active" onclick="switchTab('sender')">📤 ฝั่งส่ง</button>
    <button class="nav-btn" onclick="switchTab('receiver')">📥 ฝั่งรับ</button>
  </div>

  <!-- ปุ่มเปิด/ปิด แผงควบคุมข้างๆ -->
  <button class="toggle-side-btn" onclick="toggleSidePanel()">⚙️ แผงอัปโหลด</button>

  <!-- ==================== SENDER TAB ==================== -->
  <div id="sender-tab" class="tab-content active">
    <!-- QR Code เพียวๆ ตรงกลางจอ ไม่มีอะไรทับ -->
    <div id="qrcode"></div>

    <!-- แผงใส่ข้อมูลอยู่ "ด้านข้างขวา" -->
    <div class="side-panel" id="sidePanel">
      <span style="font-size: 12px; font-weight: bold; color: #94a3b8;">📥 ใส่ข้อมูล / เลือกไฟล์:</span>
      <textarea id="sendPayload" placeholder="พิมพ์ข้อความ หรือเลือกไฟล์..."></textarea>
      <input type="file" id="fileInput" style="width: 100%; color: #fff; font-size: 11px;">
      <button class="btn" onclick="startTransmission()">🚀 เริ่มส่งข้อมูล</button>
      <div class="status-text" id="sendStatus" style="margin-top: 4px;">พร้อมส่ง</div>
    </div>
  </div>

  <!-- ==================== RECEIVER TAB ==================== -->
  <div id="receiver-tab" class="tab-content">
    <div id="reader"></div>

    <!-- แผงสถานะฝั่งรับ อยู่มุมซ้ายล่างไม่บังกลางจอ -->
    <div class="receiver-side-panel">
      <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
      <div class="status-text" id="recvStatus">กดเปิดกล้องเพื่อสแกน</div>
      
      <button class="btn" id="startCamBtn" onclick="startCamera()" style="margin-top: 6px;">📷 เปิดกล้องสแกน</button>
      
      <textarea id="recvOutput" readonly placeholder="ผลลัพธ์..." style="display:none; color:#34d399; margin-top: 6px;"></textarea>
      <a id="downloadBtn" style="display:none; text-decoration:none; margin-top: 6px;" download="airblink_file">
        <button class="btn" style="background: var(--success-color);">💾 ดาวน์โหลดไฟล์</button>
      </a>
    </div>
  </div>

  <script>
    let qrSize = Math.min(window.innerWidth, window.innerHeight) * 0.75;
    const qrElement = document.getElementById("qrcode");
    let qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.L });

    function switchTab(mode) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (mode === 'sender') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('sender-tab').classList.add('active');
        document.querySelector('.toggle-side-btn').style.display = 'block';
        stopCamera();
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('receiver-tab').classList.add('active');
        document.querySelector('.toggle-side-btn').style.display = 'none';
        stopTransmission();
      }
    }

    function toggleSidePanel() {
      document.getElementById('sidePanel').classList.toggle('collapsed');
    }

    // SENDER LOGIC
    let sendTimer = null;
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => document.getElementById('sendPayload').value = e.target.result;
      reader.readAsDataURL(file);
    });

    function startTransmission() {
      const data = document.getElementById('sendPayload').value;
      if (!data) return alert("กรุณากรอกข้อมูลหรือเลือกไฟล์!");

      const chunkSize = 800; 
      const speed = 35;     

      const chunks = [];
      const total = Math.ceil(data.length / chunkSize);
      for (let i = 0; i < total; i++) {
        chunks.push(`${i + 1}/${total}|${data.substr(i * chunkSize, chunkSize)}`);
      }

      stopTransmission();
      let idx = 0;

      // พับแผงข้างๆ เก็บไปอัตโนมัติเมื่อกดเริ่มส่ง
      document.getElementById('sidePanel').classList.add('collapsed');

      sendTimer = setInterval(() => {
        qrCode.clear();
        qrCode.makeCode(chunks[idx]);
        document.getElementById('sendStatus').innerText = `ส่งชิ้นที่ ${idx + 1} / ${total}`;
        idx = (idx + 1) % total;
      }, speed);
    }

    function stopTransmission() {
      if (sendTimer) clearInterval(sendTimer);
    }

    // RECEIVER LOGIC
    let html5Qr = null;
    let chunks = {};
    let totalChunks = 0;
    let isDone = false;

    function startCamera() {
      chunks = {}; totalChunks = 0; isDone = false;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('recvOutput').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';

      if (!html5Qr) html5Qr = new Html5Qrcode("reader");

      html5Qr.start(
        { facingMode: "environment" },
        { fps: 60, qrbox: { width: Math.floor(window.innerWidth * 0.8), height: Math.floor(window.innerWidth * 0.8) } },
        onScanSuccess
      ).then(() => {
        document.getElementById('startCamBtn').style.display = 'none';
        document.getElementById('recvStatus').innerText = "📷 สแกนเต็มจอ...";
      }).catch(err => alert("เปิดกล้องไม่ได้: " + err));
    }

    function stopCamera() {
      if (html5Qr && html5Qr.isScanning) {
        html5Qr.stop().then(() => {
          document.getElementById('startCamBtn').style.display = 'block';
          document.getElementById('recvStatus').innerText = "กดเปิดกล้อง";
        });
      }
    }

    function onScanSuccess(text) {
      if (isDone) return;
      const match = text.match(/^(\d+)\/(\d+)\|(.*)$/s);
      if (match) {
        const curr = parseInt(match[1]);
        totalChunks = parseInt(match[2]);
        
        if (!chunks[curr]) {
          chunks[curr] = match[3];
          const count = Object.keys(chunks).length;
          const pct = Math.round((count / totalChunks) * 100);
          
          document.getElementById('progressBar').style.width = pct + '%';
          document.getElementById('recvStatus').innerText = `ได้แล้ว ${count}/${totalChunks} (${pct}%)`;
          
          if (count === totalChunks) {
            isDone = true;
            document.getElementById('recvStatus').innerText = "✅ สำเร็จ!";
            let fullData = "";
            for (let i = 1; i <= totalChunks; i++) fullData += chunks[i];
            
            const output = document.getElementById('recvOutput');
            output.value = fullData;
            output.style.display = 'block';

            if (fullData.startsWith("data:")) {
              const dl = document.getElementById('downloadBtn');
              dl.href = fullData;
              dl.style.display = 'block';
            }
            stopCamera();
          }
        }
      }
    }
  </script>
</body>
</html>
