<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirBlink Fullscreen</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #000;
      --card-bg: rgba(30, 41, 59, 0.9);
      --accent-color: #3b82f6;
      --success-color: #10b981;
      --text-color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; /* ล็อคไม่ให้สกอร์ล */
    }

    /* แถบสลับโหมดลอยด้านบน */
    .header-nav {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-btn {
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: bold;
      font-size: 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* Container หลักเต็มจอ */
    .tab-content {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ==================== SENDER STYLES ==================== */
    /* QR ใหญ่เต็มจอ */
    #qrcode {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img {
      width: 80vw !important;
      height: 80vw !important;
      max-width: 80vh !important;
      max-height: 80vh !important;
      object-fit: contain;
    }

    /* ==================== RECEIVER STYLES ==================== */
    /* กล้องเต็มหน้าจอ */
    #reader {
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
    }

    #reader video {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important; /* เต็มจอไม่มีขอบดำ */
    }

    /* Overlay กล่องควบคุมด้านล่าง */
    .control-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      z-index: 90;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    textarea {
      width: 100%;
      height: 60px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .progress-bar-container {
      width: 100%;
      background: #0f172a;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--success-color);
      transition: width 0.1s;
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: #38bdf8;
      font-weight: bold;
    }

    /* ซ่อน UI ส่วนเกินของ html5-qrcode */
    #reader__dashboard { display: none !important; }
  </style>
</head>
<body>

  <!-- แถบสลับหน้าลอยอยู่บนสุด -->
  <div class="header-nav">
    <button class="nav-btn active" onclick="switchTab('sender')">📤 ฝั่งส่ง (Sender)</button>
    <button class="nav-btn" onclick="switchTab('receiver')">📥 ฝั่งรับ (Receiver)</button>
  </div>

  <!-- ==================== 📤 ฝั่งส่ง (SENDER - FULLSCREEN QR) ==================== -->
  <div id="sender-tab" class="tab-content active">
    <!-- QR Code แสดงตรงกลางใหญ่เต็มตา -->
    <div id="qrcode"></div>

    <!-- แผงควบคุมตั้งค่าฝั่งส่งด้านล่าง -->
    <div class="control-panel">
      <textarea id="sendPayload" placeholder="พิมพ์ข้อความ หรือเลือกไฟล์..."></textarea>
      <input type="file" id="fileInput" style="margin-bottom: 8px; width: 100%; color: #fff; font-size: 11px;">
      <button class="btn" onclick="startTransmission()">🚀 เริ่มกระพริบ QR เต็มจอ</button>
      <div class="status" id="sendStatus" style="margin-top: 6px;">สถานะ: พร้อมส่ง</div>
    </div>
  </div>

  <!-- ==================== 📥 ฝั่งรับ (RECEIVER - FULLSCREEN CAMERA) ==================== -->
  <div id="receiver-tab" class="tab-content">
    <!-- กล้องขยายเต็ม 100vw x 100vh -->
    <div id="reader"></div>

    <!-- แผงควบคุมและดูผลลัพธ์ลอยด้านล่าง -->
    <div class="control-panel">
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div class="status" id="recvStatus">กดเริ่มเพื่อเปิดกล้องเต็มจอ</div>
      
      <textarea id="recvOutput" readonly placeholder="ผลลัพธ์จะขึ้นที่นี่เมื่อสแกนครบ..." style="display:none; color:#34d399; margin-top: 8px;"></textarea>
      <a id="downloadBtn" style="display:none; text-decoration:none; margin-top: 8px;" download="received_file">
        <button class="btn" style="background: var(--success-color);">💾 ดาวน์โหลดไฟล์</button>
      </a>

      <button class="btn" id="startCamBtn" onclick="startCamera()" style="margin-top: 8px;">📷 เปิดกล้องสแกน</button>
    </div>
  </div>

  <script>
    // คำนวณขนาด QR Code ให้ใหญ่ที่สุดตามความกว้าง/สูงของหน้าจอ
    function getQRSize() {
      const minDimension = Math.min(window.innerWidth, window.innerHeight);
      return Math.floor(minDimension * 0.75); // ใช้พื้นที่ 75% ของจอ
    }

    let qrSize = getQRSize();
    const qrElement = document.getElementById("qrcode");
    let qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize });

    // ปรับขนาด QR เมื่อหมุนจอหรือรีไซส์
    window.addEventListener('resize', () => {
      qrSize = getQRSize();
      qrElement.innerHTML = "";
      qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize });
    });

    // สลับ Tab
    function switchTab(mode) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (mode === 'sender') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('sender-tab').classList.add('active');
        stopCamera();
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('receiver-tab').classList.add('active');
        stopTransmission();
      }
    }

    // ==================== SENDER LOGIC ====================
    let sendTimer = null;
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => document.getElementById('sendPayload').value = e.target.result;
      reader.readAsDataURL(file);
    });

    function startTransmission() {
      const data = document.getElementById('sendPayload').value;
      if (!data) return alert("กรุณากรอกข้อความหรือเลือกไฟล์ก่อน!");

      const chunkSize = 150; // ขนาดกำลังดีสำหรับสแกนไกลๆ
      const speed = 100;     // 10 FPS

      const chunks = [];
      const total = Math.ceil(data.length / chunkSize);
      for (let i = 0; i < total; i++) {
        chunks.push(`${i + 1}/${total}|${data.substr(i * chunkSize, chunkSize)}`);
      }

      stopTransmission();
      let idx = 0;
      sendTimer = setInterval(() => {
        qrCode.clear();
        qrCode.makeCode(chunks[idx]);
        document.getElementById('sendStatus').innerText = `ส่งชิ้นที่ ${idx + 1} / ${chunks.length}`;
        idx = (idx + 1) % chunks.length;
      }, speed);
    }

    function stopTransmission() {
      if (sendTimer) clearInterval(sendTimer);
    }

    // ==================== RECEIVER LOGIC ====================
    let html5Qr = null;
    let chunks = {};
    let total = 0;
    let isDone = false;

    function startCamera() {
      chunks = {};
      total = 0;
      isDone = false;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('recvOutput').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';

      if (!html5Qr) html5Qr = new Html5Qrcode("reader");

      html5Qr.start(
        { facingMode: "environment" },
        { fps: 30, qrbox: { width: Math.floor(window.innerWidth * 0.7), height: Math.floor(window.innerWidth * 0.7) } },
        onScanSuccess
      ).then(() => {
        document.getElementById('startCamBtn').style.display = 'none';
        document.getElementById('recvStatus').innerText = "📷 กำลังสแกนเต็มจอ...";
      }).catch(err => alert("เปิดกล้องไม่ได้: " + err));
    }

    function stopCamera() {
      if (html5Qr && html5Qr.isScanning) {
        html5Qr.stop().then(() => {
          document.getElementById('startCamBtn').style.display = 'block';
          document.getElementById('recvStatus').innerText = "ปิดกล้องแล้ว";
        });
      }
    }

    function onScanSuccess(text) {
      if (isDone) return;
      const match = text.match(/^(\d+)\/(\d+)\|(.*)$/s);
      if (match) {
        const curr = parseInt(match[1]);
        total = parseInt(match[2]);
        if (!chunks[curr]) {
          chunks[curr] = match[3];
          const count = Object.keys(chunks).length;
          const pct = Math.round((count / total) * 100);
          document.getElementById('progressBar').style.width = pct + '%';
          document.getElementById('recvStatus').innerText = `ได้รับแล้ว ${count} / ${total} ชิ้น (${pct}%)`;
          
          if (count === total) {
            isDone = true;
            document.getElementById('recvStatus').innerText = "✅ สำเร็จ! ได้รับข้อมูลครบ 100%";
            let fullData = "";
            for (let i = 1; i <= total; i++) fullData += chunks[i];
            
            const output = document.getElementById('recvOutput');
            output.value = fullData;
            output.style.display = 'block';

            if (fullData.startsWith("data:")) {
              const dl = document.getElementById('downloadBtn');
              dl.href = fullData;
              dl.style.display = 'block';
            }
            stopCamera();
          }
        }
      }
    }
  </script>
</body>
</html>
