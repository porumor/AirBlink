<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirBlink - Fountain Codes Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  
  <style>
    :root {
      --bg-color: #000;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --accent-color: #3b82f6;
      --success-color: #10b981;
      --text-color: #f8fafc;
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-color); color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; display: flex;
    }

    .view-area {
      flex: 1; height: 100vh; position: relative;
      display: flex; justify-content: center; align-items: center;
      background: #000; overflow: hidden;
    }

    .sidebar {
      width: 320px; height: 100vh; background: var(--panel-bg);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; flex-direction: column; padding: 16px;
      z-index: 100; overflow-y: auto;
    }

    .tab-content { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; }
    .tab-content.active { display: flex; }

    #qrcode {
      background: #fff; padding: 16px; border-radius: 16px;
      display: flex; justify-content: center; align-items: center;
    }
    #qrcode img {
      width: 75vw !important; height: 75vw !important;
      max-width: 75vh !important; max-height: 75vh !important;
      object-fit: contain;
    }

    #reader { width: 100% !important; height: 100% !important; border: none !important; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
    #reader__dashboard { display: none !important; }

    .header-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #38bdf8; }
    .tab-switch { display: flex; background: #0f172a; padding: 4px; border-radius: 8px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.1); }
    .nav-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-weight: bold; font-size: 12px; border-radius: 6px; cursor: pointer; }
    .nav-btn.active { background: var(--accent-color); color: #fff; }

    label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; }
    textarea { width: 100%; height: 90px; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; resize: none; }
    .btn { width: 100%; padding: 10px; background: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 6px; }
    .btn-success { background: var(--success-color); }
    
    .progress-bar-container { width: 100%; background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .progress-bar { width: 0%; height: 100%; background: var(--success-color); transition: width 0.05s; }
    .status { font-size: 12px; color: #38bdf8; font-weight: bold; margin-top: 6px; }

    @media (max-width: 768px) {
      body, html { flex-direction: column; }
      .view-area { height: 60vh; }
      .sidebar { width: 100vw; height: 40vh; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
      #qrcode img { width: 55vw !important; height: 55vw !important; }
    }
  </style>
</head>
<body>

  <div class="view-area">
    <div id="sender-tab" class="tab-content active"><div id="qrcode"></div></div>
    <div id="receiver-tab" class="tab-content"><div id="reader"></div></div>
  </div>

  <div class="sidebar">
    <div class="header-title">⚡ AirBlink Fountain</div>
    
    <div class="tab-switch">
      <button class="nav-btn active" onclick="switchTab('sender')">📤 ฝั่งส่ง</button>
      <button class="nav-btn" onclick="switchTab('receiver')">📥 ฝั่งรับ</button>
    </div>

    <!-- SENDER CONTROLS -->
    <div id="sender-controls">
      <label>ข้อความ หรือ ไฟล์:</label>
      <textarea id="sendPayload" placeholder="พิมพ์ข้อความ..."></textarea>
      <input type="file" id="fileInput" style="margin-bottom: 8px; width: 100%; color: #fff; font-size: 11px;">
      <button class="btn" onclick="startFountainTransmission()">🚀 พ่นข้อมูล Fountain Codes (1-Way)</button>
      <div class="status" id="sendStatus">พร้อมส่ง</div>
    </div>

    <!-- RECEIVER CONTROLS -->
    <div id="receiver-controls" style="display:none;">
      <button class="btn btn-success" id="startCamBtn" onclick="startCamera()">📷 เปิดกล้องสแกนรับละออง</button>
      <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
      <div class="status" id="recvStatus">รอกดเปิดกล้อง</div>
      
      <textarea id="recvOutput" readonly placeholder="ผลลัพธ์..." style="display:none; color:#34d399; margin-top: 6px; height: 70px;"></textarea>
      <a id="downloadBtn" style="display:none; text-decoration:none; margin-top: 6px;" download="airblink_file">
        <button class="btn btn-success">💾 ดาวน์โหลดไฟล์</button>
      </a>
    </div>
  </div>

  <script>
    let qrSize = Math.min(window.innerWidth, window.innerHeight) * 0.65;
    const qrElement = document.getElementById("qrcode");
    let qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.L });

    function switchTab(mode) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (mode === 'sender') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('sender-tab').classList.add('active');
        document.getElementById('sender-controls').style.display = 'block';
        document.getElementById('receiver-controls').style.display = 'none';
        stopCamera();
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('receiver-tab').classList.add('active');
        document.getElementById('sender-controls').style.display = 'none';
        document.getElementById('receiver-controls').style.display = 'block';
        stopTransmission();
      }
    }

    let sendTimer = null;
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => document.getElementById('sendPayload').value = e.target.result;
      reader.readAsDataURL(file);
    });

    // ==================== 𝜟 FOUNTAIN MATH LOGIC ====================
    // ฟังก์ชัน XOR ข้อความสองก้อนเข้าด้วยกัน
    function xorStrings(a, b) {
      let result = "";
      const len = Math.max(a.length, b.length);
      for (let i = 0; i < len; i++) {
        const codeA = a.charCodeAt(i) || 0;
        const codeB = b.charCodeAt(i) || 0;
        result += String.fromCharCode(codeA ^ codeB);
      }
      return result;
    }

    function startFountainTransmission() {
      const rawData = document.getElementById('sendPayload').value;
      if (!rawData) return alert("กรุณากรอกข้อความหรือเลือกไฟล์!");

      const compressed = LZString.compressToEncodedURIComponent(rawData);
      const chunkSize = 350; 
      const K = Math.ceil(compressed.length / chunkSize); // จำนวนชิ้นฐาน
      
      const baseChunks = [];
      for (let i = 0; i < K; i++) {
        baseChunks.push(compressed.substr(i * chunkSize, chunkSize));
      }

      stopTransmission();
      let seedCounter = 1;

      // ⛲ พ่นละอองข้อมูล (Droplets) ออกไปเรื่อยๆ แบบไม่มีวันจบ ไม่ต้องมีชิ้นสุดท้าย
      sendTimer = setInterval(() => {
        // ใช้ Seed สร้างสุ่มการผสมแบบ Pseudo-Random
        const degree = (seedCounter % 2 === 0 && K > 1) ? 2 : 1; // สลับผสม 1 ชิ้น และ 2 ชิ้น
        let indices = [];
        let mixData = "";

        if (degree === 1) {
          const idx = (seedCounter - 1) % K;
          indices = [idx];
          mixData = baseChunks[idx];
        } else {
          const idx1 = (seedCounter - 1) % K;
          const idx2 = seedCounter % K;
          indices = [idx1, idx2];
          mixData = xorStrings(baseChunks[idx1], baseChunks[idx2]);
        }

        // โครงสร้าง Droplet: [K|Indices_CSV|Data_Base64]
        const payload = `${K}|${indices.join(",")}|${btoa(encodeURIComponent(mixData))}`;

        qrCode.clear();
        qrCode.makeCode(payload);
        document.getElementById('sendStatus').innerText = `⛲ พ่นละอองข้อมูล Droplet #${seedCounter} (K=${K})`;
        seedCounter++;
      }, 30);
    }

    function stopTransmission() {
      if (sendTimer) clearInterval(sendTimer);
    }

    // ==================== 📥 FOUNTAIN DECODER LOGIC ====================
    let html5Qr = null;
    let receivedDroplets = [];
    let requiredK = 0;
    let isDone = false;

    function startCamera() {
      receivedDroplets = []; requiredK = 0; isDone = false;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('recvOutput').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';

      if (!html5Qr) html5Qr = new Html5Qrcode("reader");

      html5Qr.start(
        { facingMode: "environment" },
        { fps: 60, qrbox: { width: Math.floor(window.innerWidth * 0.7), height: Math.floor(window.innerWidth * 0.7) } },
        onScanSuccess
      ).then(() => {
        document.getElementById('startCamBtn').style.display = 'none';
        document.getElementById('recvStatus').innerText = "📷 กำลังสแกนดักจับละอองข้อมูล...";
      }).catch(err => alert("เปิดกล้องไม่ได้: " + err));
    }

    function stopCamera() {
      if (html5Qr && html5Qr.isScanning) {
        html5Qr.stop().then(() => {
          document.getElementById('startCamBtn').style.display = 'block';
          document.getElementById('recvStatus').innerText = "ปิดกล้องแล้ว";
        });
      }
    }

    function onScanSuccess(text) {
      if (isDone) return;
      const parts = text.split("|");
      if (parts.length === 3) {
        const K = parseInt(parts[0]);
        const indices = parts[1].split(",").map(Number);
        const data = decodeURIComponent(atob(parts[2]));

        requiredK = K;

        // บันทึกเฉพาะ Droplet ที่ไม่ซ้ำทางสมการ
        const dropletKey = indices.sort().join(",");
        if (!receivedDroplets.some(d => d.key === dropletKey)) {
          receivedDroplets.push({ indices, data, key: dropletKey });

          // คำนวณความคืบหน้าตามจำนวนละอองที่สะสมได้เทียบกับ K
          const pct = Math.min(100, Math.round((receivedDroplets.length / requiredK) * 100));
          document.getElementById('progressBar').style.width = pct + '%';
          document.getElementById('recvStatus').innerText = `สะสมละอองได้แล้ว ${receivedDroplets.length} / ${requiredK} ก้อน (${pct}%)`;

          // เมื่อสะสมละอองได้ครบ K ก้อน แก้สมการถอดรหัสทันที!
          if (receivedDroplets.length >= requiredK) {
            solveAndComplete();
          }
        }
      }
    }

    // ถอดรหัสระบบสมการ XOR (Gaussian Elimination Simplification)
    function solveAndComplete() {
      isDone = true;
      document.getElementById('recvStatus').innerText = "𝜟 สำเร็จ! กำลังแก้สมการถอดรหัสข้อมูล...";

      const solved = {};
      let changed = true;

      // แก้สมการวนลูปจนได้ชิ้นส่วนฐานครบ 0..K-1
      while (changed) {
        changed = false;
        for (let droplet of receivedDroplets) {
          // ตัดชิ้นที่แก้รหัสได้แล้วออกจากสมการ
          droplet.indices = droplet.indices.filter(idx => {
            if (solved[idx] !== undefined) {
              droplet.data = xorStrings(droplet.data, solved[idx]);
              return false;
            }
            return true;
          });

          // ถ้าเหลือชิ้นเดียวในสมการ ถอดรหัสชิ้นนั้นได้ทันที!
          if (droplet.indices.length === 1) {
            const idx = droplet.indices[0];
            solved[idx] = droplet.data;
            changed = true;
          }
        }
      }

      // ประกอบชิ้นส่วนคืนกลับเป็นไฟล์เต็ม
      let fullCompressed = "";
      for (let i = 0; i < requiredK; i++) {
        fullCompressed += (solved[i] || "");
      }

      const fullData = LZString.decompressFromEncodedURIComponent(fullCompressed);

      document.getElementById('recvStatus').innerText = "✅ สำเร็จ! ถอดรหัสสมบูรณ์ 100%";
      const output = document.getElementById('recvOutput');
      output.value = fullData;
      output.style.display = 'block';

      if (fullData && fullData.startsWith("data:")) {
        const dl = document.getElementById('downloadBtn');
        dl.href = fullData;
        dl.style.display = 'block';
      }
      stopCamera();
    }
  </script>
</body>
</html>
