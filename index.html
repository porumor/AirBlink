<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบถอดความเสียง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    audio::-webkit-media-controls-panel { background-color: #171717; }
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display { color: #ffffff; }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-start py-12 px-4 sm:px-6 lg:px-8 selection:bg-white selection:text-black">

  <div class="max-w-3xl w-full mx-auto space-y-8">
    
    <!-- ส่วนหัวทางการ -->
    <header class="border-b border-neutral-800 pb-5">
      <h1 class="text-xl font-semibold tracking-tight text-white uppercase">ระบบถอดความเสียง</h1>
      <p class="text-xs text-neutral-400 mt-1">แปลงไฟล์เสียงเป็นข้อความตามต้นฉบับ (แบ่งท่อนละไม่เกิน 10 นาที)</p>
    </header>

    <!-- ส่วนตั้งค่าความปลอดภัยและอัปโหลดไฟล์ -->
    <section class="space-y-4">
      
      <!-- ช่องกรอก API Key -->
      <div class="border border-neutral-800 bg-neutral-950 p-4 space-y-2">
        <div class="flex justify-between items-center">
          <label for="apiKeyInput" class="text-xs text-neutral-400 uppercase tracking-wider font-medium">Google Gemini API Key</label>
          <button type="button" id="toggleKeyBtn" class="text-[11px] text-neutral-500 hover:text-neutral-300">แสดงรหัส</button>
        </div>
        <input 
          type="password" 
          id="apiKeyInput" 
          placeholder="วาง API Key ที่นี่ (ระบบจะบันทึกเฉพาะในอุปกรณ์นี้)" 
          class="w-full px-3 py-2 bg-black border border-neutral-800 text-neutral-200 text-xs font-mono placeholder-neutral-700 focus:border-neutral-500 focus:outline-none"
        >
      </div>

      <!-- กล่องเลือกไฟล์ -->
      <div 
        id="dropZone"
        class="border border-neutral-800 hover:border-neutral-500 bg-neutral-950 p-8 text-center cursor-pointer transition rounded-none"
      >
        <input type="file" id="fileInput" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.mp4,.flac" class="hidden">
        <p class="text-sm font-medium text-neutral-200">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวางที่นี่</p>
        <p class="text-xs text-neutral-500 mt-1">รองรับไฟล์เสียงทุกความยาว ระบบตัดแบ่งประมวลผลท่อนละ 10 นาทีให้อัตโนมัติ</p>
      </div>

      <!-- ส่วนตรวจสอบข้อมูลและรีวิวเสียง -->
      <div id="previewContainer" class="hidden border border-neutral-800 bg-neutral-950 p-4 space-y-3">
        <div class="flex flex-col sm:flex-row justify-between sm:items-center text-xs text-neutral-400 border-b border-neutral-900 pb-2 gap-1">
          <span id="fileName" class="truncate max-w-md text-neutral-200 font-medium"></span>
          <span id="fileMeta" class="font-mono text-neutral-400"></span>
        </div>
        <div>
          <label class="block text-[11px] text-neutral-500 uppercase tracking-wider mb-1.5">รีวิวเสียง</label>
          <audio id="audioPlayer" controls class="w-full h-8 bg-neutral-900 rounded-none"></audio>
        </div>
      </div>

      <!-- ปุ่มเริ่มประมวลผล -->
      <button 
        id="startBtn" 
        disabled 
        class="w-full py-3 bg-white text-black text-xs font-semibold uppercase tracking-wider hover:bg-neutral-200 disabled:bg-neutral-900 disabled:text-neutral-600 disabled:cursor-not-allowed transition"
      >
        เริ่มการถอดความ
      </button>

      <!-- ส่วนแสดงสถานะและเปอร์เซ็นต์ความคืบหน้ารวม -->
      <div id="progressSection" class="hidden border border-neutral-800 bg-neutral-950 p-4 space-y-2">
        <div class="flex justify-between items-center text-xs">
          <span id="statusText" class="text-neutral-400">กำลังเตรียมข้อมูล...</span>
          <span id="percentText" class="font-mono text-white font-semibold">0%</span>
        </div>
        <div class="w-full h-1 bg-neutral-900 overflow-hidden">
          <div id="progressBar" class="h-full bg-white transition-all duration-150" style="width: 0%;"></div>
        </div>
      </div>

    </section>

    <!-- ส่วนสรุปและส่งออกข้อมูลทั้งหมด -->
    <section id="globalActionSection" class="hidden border-b border-neutral-800 pb-4 flex justify-between items-center text-xs">
      <div>
        <span class="text-neutral-300 font-medium uppercase tracking-wider text-[11px]">รายการข้อความที่ถอดได้</span>
        <span id="globalStats" class="text-neutral-500 ml-2 font-mono"></span>
      </div>
      <div class="flex gap-2">
        <button id="copyAllBtn" class="px-3 py-1.5 border border-neutral-800 hover:border-neutral-600 text-neutral-300 text-xs transition">คัดลอกทั้งหมด</button>
        <button id="downloadAllBtn" class="px-3 py-1.5 bg-white text-black font-semibold text-xs hover:bg-neutral-200 transition">ดาวน์โหลด TXT ทั้งหมด</button>
      </div>
    </section>

    <!-- คอนเทนเนอร์แสดงกล่องข้อความแยกแต่ละท่อน -->
    <section id="chunksContainer" class="space-y-6"></section>

  </div>

  <script>
    const MODEL = "gemini-3.6-flash";
    const CHUNK_DURATION_SEC = 10 * 60; // 10 นาที (600 วินาที)
    const OVERLAP_SEC = 2; // ซ้อนรอยต่อ 2 วินาที ป้องกันคำขาด

    const apiKeyInput = document.getElementById('apiKeyInput');
    const toggleKeyBtn = document.getElementById('toggleKeyBtn');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const fileName = document.getElementById('fileName');
    const fileMeta = document.getElementById('fileMeta');
    const audioPlayer = document.getElementById('audioPlayer');
    const startBtn = document.getElementById('startBtn');
    const progressSection = document.getElementById('progressSection');
    const statusText = document.getElementById('statusText');
    const percentText = document.getElementById('percentText');
    const progressBar = document.getElementById('progressBar');
    const globalActionSection = document.getElementById('globalActionSection');
    const globalStats = document.getElementById('globalStats');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const chunksContainer = document.getElementById('chunksContainer');

    let currentFile = null;
    let decodedAudioBuffer = null;
    let totalCalculatedDuration = 0;

    // โหลดคีย์ที่บันทึกไว้ในเบราว์เซอร์
    const savedApiKey = localStorage.getItem('custom_gemini_api_key');
    if (savedApiKey) {
      apiKeyInput.value = savedApiKey;
    }

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('custom_gemini_api_key', apiKeyInput.value.trim());
      validateReady();
    });

    toggleKeyBtn.addEventListener('click', () => {
      const isPwd = apiKeyInput.type === 'password';
      apiKeyInput.type = isPwd ? 'text' : 'password';
      toggleKeyBtn.textContent = isPwd ? 'ซ่อนรหัส' : 'แสดงรหัส';
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-neutral-500'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-neutral-500'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-neutral-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function validateReady() {
      const hasKey = apiKeyInput.value.trim().length > 0;
      const hasFile = currentFile !== null && (decodedAudioBuffer !== null || totalCalculatedDuration > 0);
      startBtn.disabled = !(hasKey && hasFile);
    }

    function formatTime(seconds) {
      const totalSec = Math.floor(seconds);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    async function handleFile(file) {
      currentFile = file;
      fileName.textContent = file.name;
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
      fileMeta.textContent = `ขนาด ${sizeMB} MB (กำลังคำนวณความยาว...)`;
      audioPlayer.src = URL.createObjectURL(file);
      previewContainer.classList.remove('hidden');
      startBtn.disabled = true;
      startBtn.textContent = 'กำลังตรวจสอบโครงสร้างไฟล์เสียง...';

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await file.arrayBuffer();
        decodedAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        totalCalculatedDuration = decodedAudioBuffer.duration;
        const totalChunks = Math.ceil(totalCalculatedDuration / CHUNK_DURATION_SEC);
        
        fileMeta.textContent = `ขนาด ${sizeMB} MB | ความยาว ${formatTime(totalCalculatedDuration)} (${totalChunks} ท่อน)`;
        startBtn.textContent = 'เริ่มการถอดความ';
        validateReady();
      } catch (err) {
        audioPlayer.onloadedmetadata = () => {
          totalCalculatedDuration = audioPlayer.duration;
          const totalChunks = Math.ceil(totalCalculatedDuration / CHUNK_DURATION_SEC);
          fileMeta.textContent = `ขนาด ${sizeMB} MB | ความยาว ${formatTime(totalCalculatedDuration)} (${totalChunks} ท่อน)`;
          startBtn.textContent = 'เริ่มการถอดความ';
          validateReady();
        };
      }
    }

    function setProgress(percent, text) {
      const p = Math.min(100, Math.max(0, Math.round(percent)));
      percentText.textContent = `${p}%`;
      progressBar.style.width = `${p}%`;
      if (text) statusText.textContent = text;
    }

    function bufferTo16kWavBlob(audioBuffer) {
      const sampleRate = audioBuffer.sampleRate;
      const length = audioBuffer.length;
      const pcmData = new Int16Array(length);
      const ch0 = audioBuffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        let s = Math.max(-1, Math.min(1, ch0[i]));
        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      const bitDepth = 16;
      const byteRate = sampleRate * 1 * (bitDepth / 8);
      const blockAlign = 1 * (bitDepth / 8);
      const dataSize = length * (bitDepth / 8);
      const bufferSize = 44 + dataSize;
      const arrayBuffer = new ArrayBuffer(bufferSize);
      const view = new DataView(arrayBuffer);

      function writeString(offset, str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < length; i++, offset += 2) {
        view.setInt16(offset, pcmData[i], true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    async function extractAudioChunkBlob(buffer, startSec, endSec) {
      const targetRate = 16000;
      const duration = endSec - startSec;
      const targetFrames = Math.ceil(duration * targetRate);

      const offlineCtx = new OfflineAudioContext(1, targetFrames, targetRate);
      const source = offlineCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(offlineCtx.destination);
      source.start(0, startSec, duration);

      const renderedBuffer = await offlineCtx.startRendering();
      return bufferTo16kWavBlob(renderedBuffer);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = err => reject(err);
        reader.readAsDataURL(blob);
      });
    }

    function downloadTxtFile(filename, text) {
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 300);
    }

    function createChunkUI(index, total, startSec, endSec) {
      const card = document.createElement('div');
      card.className = 'border border-neutral-800 bg-neutral-950 p-4 space-y-3';
      card.id = `chunk-card-${index}`;

      const header = document.createElement('div');
      header.className = 'flex justify-between items-center text-xs';

      const label = document.createElement('span');
      label.className = 'text-neutral-300 font-medium';
      label.textContent = `ท่อนที่ ${index + 1}/${total} (${formatTime(startSec)} - ${formatTime(endSec)})`;

      const btnGroup = document.createElement('div');
      btnGroup.className = 'flex gap-2';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'px-2.5 py-1 border border-neutral-800 hover:border-neutral-600 text-neutral-400 hover:text-neutral-200 text-xs transition';
      copyBtn.textContent = 'คัดลอก';

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'px-2.5 py-1 border border-neutral-800 hover:border-neutral-600 text-neutral-400 hover:text-neutral-200 text-xs transition';
      downloadBtn.textContent = 'ดาวน์โหลด TXT';

      btnGroup.appendChild(copyBtn);
      btnGroup.appendChild(downloadBtn);
      header.appendChild(label);
      header.appendChild(btnGroup);

      const textarea = document.createElement('textarea');
      textarea.rows = 8;
      textarea.placeholder = `กำลังรอการประมวลผลท่อนที่ ${index + 1}...`;
      textarea.className = 'w-full p-3 bg-black border border-neutral-800 text-neutral-200 text-sm leading-relaxed placeholder-neutral-700 focus:border-neutral-500 focus:outline-none resize-y';
      textarea.id = `chunk-text-${index}`;

      card.appendChild(header);
      card.appendChild(textarea);
      chunksContainer.appendChild(card);

      copyBtn.addEventListener('click', () => {
        if (!textarea.value) return;
        navigator.clipboard.writeText(textarea.value).then(() => {
          copyBtn.textContent = 'คัดลอกแล้ว';
          setTimeout(() => copyBtn.textContent = 'คัดลอก', 2000);
        });
      });

      downloadBtn.addEventListener('click', () => {
        if (!textarea.value) return;
        const name = `${currentFile.name.replace(/\.[^/.]+$/, "")}_part_${index + 1}.txt`;
        downloadTxtFile(name, textarea.value);
      });

      return textarea;
    }
              async function streamGenerateWithRetry(apiKey, base64Audio, onChunk, maxRetries = 3) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:streamGenerateContent?alt=sse&key=${apiKey}`;
      let attempt = 0;

      const payload = {
        contents: [{
          parts: [
            { inline_data: { mime_type: 'audio/wav', data: base64Audio } },
            { text: "ถอดความเสียงจากไฟล์นี้แบบตรงตามต้นฉบับ 100% คำต่อคำ ห้ามสรุปความ ห้ามตัดทอนข้อความใดๆ ทั้งสิ้น คงคำพูดซ้ำ ภาษาพูด และคำอุทานไว้ทั้งหมด จัดย่อหน้าและใส่วรรคตอนให้อ่านเข้าใจง่าย" }
          ]
        }],
        generationConfig: { temperature: 0.0 }
      };

      while (attempt < maxRetries) {
        attempt++;
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.status === 503 || response.status === 429) {
            for (let s = attempt * 3; s > 0; s--) {
              statusText.textContent = `เซิร์ฟเวอร์มีความต้องการสูง กำลังลองใหม่อัตโนมัติใน ${s} วินาที (ครั้งที่ ${attempt}/${maxRetries})...`;
              await new Promise(r => setTimeout(r, 1000));
            }
            continue;
          }

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const jsonStr = line.slice(6).trim();
                if (!jsonStr || jsonStr === '[DONE]') continue;
                try {
                  const parsed = JSON.parse(jsonStr);
                  const chunkText = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                  if (chunkText) onChunk(chunkText);
                } catch (e) {}
              }
            }
          }

          return;

        } catch (err) {
          if (attempt >= maxRetries) throw err;
          await new Promise(r => setTimeout(r, 2000));
        }
      }
      throw new Error('การเชื่อมต่อกับเซิร์ฟเวอร์ขัดข้อง');
    }

    startBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey || !currentFile || !decodedAudioBuffer) {
        alert('กรุณาระบุ API Key และเลือกไฟล์เสียง');
        return;
      }

      startBtn.disabled = true;
      progressSection.classList.remove('hidden');
      globalActionSection.classList.add('hidden');
      chunksContainer.innerHTML = '';

      const totalDuration = totalCalculatedDuration || decodedAudioBuffer.duration;
      const totalChunks = Math.ceil(totalDuration / CHUNK_DURATION_SEC);

      setProgress(0, `เตรียมเริ่มประมวลผลทั้งหมด ${totalChunks} ท่อน...`);

      try {
        for (let i = 0; i < totalChunks; i++) {
          const startSec = i * CHUNK_DURATION_SEC;
          const nominalEndSec = Math.min((i + 1) * CHUNK_DURATION_SEC, totalDuration);
          const actualEndSec = Math.min((i + 1) * CHUNK_DURATION_SEC + (i + 1 < totalChunks ? OVERLAP_SEC : 0), totalDuration);

          const overallStartPct = (i / totalChunks) * 100;
          const overallEndPct = ((i + 1) / totalChunks) * 100;

          setProgress(overallStartPct + 2, `กำลังตัดแบ่งท่อนที่ ${i + 1}/${totalChunks} (${formatTime(startSec)} - ${formatTime(nominalEndSec)})...`);

          const textarea = createChunkUI(i, totalChunks, startSec, nominalEndSec);
          textarea.placeholder = `กำลังถอดความท่อนที่ ${i + 1}...`;

          const chunkWavBlob = await extractAudioChunkBlob(decodedAudioBuffer, startSec, actualEndSec);
          const base64Audio = await blobToBase64(chunkWavBlob);

          setProgress(overallStartPct + 5, `กำลังส่งท่อนที่ ${i + 1}/${totalChunks} เข้าเอนจิน AI...`);

          let chunkText = '';
          await streamGenerateWithRetry(apiKey, base64Audio, (token) => {
            chunkText += token;
            textarea.value = chunkText;
            textarea.scrollTop = textarea.scrollHeight;
            updateGlobalStats();
          });

          setProgress(overallEndPct, `ท่อนที่ ${i + 1}/${totalChunks} เสร็จสมบูรณ์`);
        }

        setProgress(100, 'ถอดความครบทุกท่อนเรียบร้อย 100%');
        globalActionSection.classList.remove('hidden');
        updateGlobalStats();

      } catch (err) {
        alert(`เกิดข้อผิดพลาด: ${err.message}`);
        statusText.textContent = `การทำงานหยุดชะงัก: ${err.message}`;
      } finally {
        startBtn.disabled = false;
      }
    });

    function updateGlobalStats() {
      const textareas = chunksContainer.querySelectorAll('textarea');
      let totalLen = 0;
      textareas.forEach(t => totalLen += t.value.length);
      globalStats.textContent = `(รวมทั้งหมด ${totalLen.toLocaleString()} ตัวอักษร)`;
    }

    function getCombinedText() {
      const textareas = chunksContainer.querySelectorAll('textarea');
      let combined = '';
      textareas.forEach((t, idx) => {
        const card = document.getElementById(`chunk-card-${idx}`);
        const title = card ? card.querySelector('span').textContent : `ท่อนที่ ${idx + 1}`;
        combined += `--- ${title} ---\n\n${t.value}\n\n`;
      });
      return combined.trim();
    }

    copyAllBtn.addEventListener('click', () => {
      const combined = getCombinedText();
      if (!combined) return;
      navigator.clipboard.writeText(combined).then(() => {
        copyAllBtn.textContent = 'คัดลอกทั้งหมดแล้ว';
        setTimeout(() => copyAllBtn.textContent = 'คัดลอกทั้งหมด', 2000);
      });
    });

    downloadAllBtn.addEventListener('click', () => {
      const combined = getCombinedText();
      if (!combined) return;
      const baseName = currentFile ? currentFile.name.replace(/\.[^/.]+$/, "") : "transcript";
      downloadTxtFile(`${baseName}_full_transcript.txt`, combined);
    });
  </script>
</body>
</html>
