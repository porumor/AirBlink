<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirBlink - Turbo Rocket Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  
  <style>
    :root {
      --bg-color: #000;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --accent-color: #ef4444; /* Turbo Red */
      --success-color: #10b981;
      --text-color: #f8fafc;
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-color); color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; display: flex;
    }

    .view-area {
      flex: 1; height: 100vh; position: relative;
      display: flex; justify-content: center; align-items: center;
      background: #000; overflow: hidden;
    }

    .sidebar {
      width: 320px; height: 100vh; background: var(--panel-bg);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; flex-direction: column; padding: 16px;
      z-index: 100; overflow-y: auto;
    }

    .tab-content { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; }
    .tab-content.active { display: flex; }

    /* QR 1X ตัวใหญ่ จุดใหญ่ อ่านง่ายสุดๆ */
    #qrcode {
      background: #fff; padding: 16px; border-radius: 16px;
      display: flex; justify-content: center; align-items: center;
    }
    #qrcode img {
      width: 75vw !important; height: 75vw !important;
      max-width: 75vh !important; max-height: 75vh !important;
      object-fit: contain;
      image-rendering: pixelated; /* เร่งความคมชัดจุด */
    }

    /* กล้องและ Canvas สำหรับสแกน Direct Frame */
    #video { width: 100vw; height: 100vh; object-fit: cover; }
    #canvas { display: none; }

    .header-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #ef4444; display:flex; align-items:center; gap:6px; }
    .tab-switch { display: flex; background: #0f172a; padding: 4px; border-radius: 8px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.1); }
    .nav-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-weight: bold; font-size: 12px; border-radius: 6px; cursor: pointer; }
    .nav-btn.active { background: var(--accent-color); color: #fff; }

    label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; }
    textarea { width: 100%; height: 90px; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; resize: none; }
    .btn { width: 100%; padding: 10px; background: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 6px; }
    .btn-success { background: var(--success-color); }
    
    .progress-bar-container { width: 100%; background: #0f172a; height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent-color); transition: width 0.03s; }
    .status { font-size: 12px; color: #f87171; font-weight: bold; margin-top: 6px; }

    @media (max-width: 768px) {
      body, html { flex-direction: column; }
      .view-area { height: 60vh; }
      .sidebar { width: 100vw; height: 40vh; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
      #qrcode img { width: 55vw !important; height: 55vw !important; }
    }
  </style>
</head>
<body>

  <div class="view-area">
    <div id="sender-tab" class="tab-content active"><div id="qrcode"></div></div>
    <div id="receiver-tab" class="tab-content">
      <video id="video" playsinline></video>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div class="sidebar">
    <div class="header-title">🚀 Turbo Rocket</div>
    
    <div class="tab-switch">
      <button class="nav-btn active" onclick="switchTab('sender')">📤 ฝั่งส่ง</button>
      <button class="nav-btn" onclick="switchTab('receiver')">📥 ฝั่งรับ</button>
    </div>

    <!-- SENDER CONTROLS -->
    <div id="sender-controls">
      <label>ข้อความ หรือ ไฟล์:</label>
      <textarea id="sendPayload" placeholder="พิมพ์ข้อความ..."></textarea>
      <input type="file" id="fileInput" style="margin-bottom: 8px; width: 100%; color: #fff; font-size: 11px;">
      <button class="btn" onclick="startTurboTransmission()">🚀 ยิงข้อมูลติดจรวด (Ultra-Fast)</button>
      <div class="status" id="sendStatus">พร้อมส่ง</div>
    </div>

    <!-- RECEIVER CONTROLS -->
    <div id="receiver-controls" style="display:none;">
      <button class="btn btn-success" id="startCamBtn" onclick="startCamera()">📷 เปิดกล้องสแกนยิงจรวด</button>
      <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
      <div class="status" id="recvStatus">รอกดเปิดกล้อง</div>
      
      <textarea id="recvOutput" readonly placeholder="ผลลัพธ์..." style="display:none; color:#34d399; margin-top: 6px; height: 70px;"></textarea>
      <a id="downloadBtn" style="display:none; text-decoration:none; margin-top: 6px;" download="airblink_file">
        <button class="btn btn-success">💾 ดาวน์โหลดไฟล์</button>
      </a>
    </div>
  </div>

  <script>
    let qrSize = Math.min(window.innerWidth, window.innerHeight) * 0.65;
    const qrElement = document.getElementById("qrcode");
    // ใช้ Correction Level L เพื่อให้จุดมีขนาดใหญ่ที่สุด สแกนไวที่สุด
    let qrCode = new QRCode(qrElement, { width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.L });

    function switchTab(mode) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (mode === 'sender') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('sender-tab').classList.add('active');
        document.getElementById('sender-controls').style.display = 'block';
        document.getElementById('receiver-controls').style.display = 'none';
        stopCamera();
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('receiver-tab').classList.add('active');
        document.getElementById('sender-controls').style.display = 'none';
        document.getElementById('receiver-controls').style.display = 'block';
        stopTransmission();
      }
    }

    let sendTimer = null;
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => document.getElementById('sendPayload').value = e.target.result;
      reader.readAsDataURL(file);
    });

    // ==================== 🚀 TURBO SENDER (MINIMAL MATRIX) ====================
    function startTurboTransmission() {
      const rawData = document.getElementById('sendPayload').value;
      if (!rawData) return alert("กรุณากรอกข้อความหรือเลือกไฟล์!");

      const compressed = LZString.compressToEncodedURIComponent(rawData);
      
      // ⚡ เคล็ดลับความไว: หั่นชิ้นส่วนให้เล็กมาก (60 Chars) 
      // เพื่อให้ QR Code ลายจุดน้อยที่สุด รูปร่างใหญ่ โฟกัสได้ติดจรวด
      const chunkSize = 60; 
      const speed = 18; // ⚡ 18ms ต่อเฟรม (~55 FPS) ไวสุดขีดทางกายภาพ

      const chunks = [];
      const total = Math.ceil(compressed.length / chunkSize);
      for (let i = 0; i < total; i++) {
        // แปะ Header สั้นสุดๆ [idx/total|data]
        chunks.push(`${i + 1}/${total}|${compressed.substr(i * chunkSize, chunkSize)}`);
      }

      stopTransmission();
      let idx = 0;

      sendTimer = setInterval(() => {
        qrCode.clear();
        qrCode.makeCode(chunks[idx]);
        document.getElementById('sendStatus').innerText = `🚀 TURBO STREAMING: ${idx + 1} / ${total}`;
        idx = (idx + 1) % total;
      }, speed);
    }

    function stopTransmission() {
      if (sendTimer) clearInterval(sendTimer);
    }

    // ==================== 🚀 TURBO RECEIVER (DIRECT CANVAS 60FPS) ====================
    let video = document.getElementById("video");
    let canvasElement = document.getElementById("canvas");
    let canvas = canvasElement.getContext("2d");
    let animationFrameId = null;
    
    let receivedChunks = {};
    let totalChunks = 0;
    let isDone = false;

    function startCamera() {
      receivedChunks = {}; totalChunks = 0; isDone = false;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('recvOutput').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';

      // เปิดกล้องแบบ 60 FPS ไร้ UI กีดขวาง
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", frameRate: { ideal: 60 } } })
        .then(function(stream) {
          video.srcObject = stream;
          video.setAttribute("playsinline", true);
          video.play();
          document.getElementById('startCamBtn').style.display = 'none';
          document.getElementById('recvStatus').innerText = "⚡ สแกนติดจรวด 60 FPS...";
          animationFrameId = requestAnimationFrame(scanFrameDirect);
        })
        .catch(err => alert("เปิดกล้องไม่ได้: " + err));
    }

    function stopCamera() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        document.getElementById('startCamBtn').style.display = 'block';
        document.getElementById('recvStatus').innerText = "ปิดกล้องแล้ว";
      }
    }

    // ฟังก์ชันดึงภาพตรงจากกล้องลง Canvas ถอดรหัสทันทีทุกความเร็ว 60Hz
    function scanFrameDirect() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && !isDone) {
        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        
        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
        // ถอดรหัสด้วย jsQR Engine ที่ไวที่สุด
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

        if (code && code.data) {
          onTurboChunkScanned(code.data);
        }
      }
      if (!isDone) {
        animationFrameId = requestAnimationFrame(scanFrameDirect);
      }
    }

    function onTurboChunkScanned(text) {
      const match = text.match(/^(\d+)\/(\d+)\|(.*)$/s);
      if (match) {
        const curr = parseInt(match[1]);
        totalChunks = parseInt(match[2]);
        
        if (!receivedChunks[curr]) {
          receivedChunks[curr] = match[3];
          const count = Object.keys(receivedChunks).length;
          const pct = Math.round((count / totalChunks) * 100);
          
          document.getElementById('progressBar').style.width = pct + '%';
          document.getElementById('recvStatus').innerText = `🚀 ได้รับแล้ว ${count} / ${totalChunks} ชิ้น (${pct}%)`;

          if (count === totalChunks) {
            isDone = true;
            document.getElementById('recvStatus').innerText = "✅ สำเร็จ 100%! กำลังประมวลผล...";

            let fullCompressed = "";
            for (let i = 1; i <= totalChunks; i++) fullCompressed += receivedChunks[i];
            
            const fullData = LZString.decompressFromEncodedURIComponent(fullCompressed);

            document.getElementById('recvStatus').innerText = "✅ สำเร็จ! ได้รับข้อมูลสมบูรณ์";
            const output = document.getElementById('recvOutput');
            output.value = fullData;
            output.style.display = 'block';

            if (fullData && fullData.startsWith("data:")) {
              const dl = document.getElementById('downloadBtn');
              dl.href = fullData;
              dl.style.display = 'block';
            }
            stopCamera();
          }
        }
      }
    }
  </script>
</body>
</html>
